appId: local.canvasapp.desktop
productName: 无限画布
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: stage/node
    to: node
  - from: stage/canvas
    to: canvas
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
artifactName: CanvasApp-Setup-${version}.${ext}
linux:
  executableName: canvas-app
  artifactName: CanvasApp-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  packageName: canvas-app
  maintainer: kapone-systems
